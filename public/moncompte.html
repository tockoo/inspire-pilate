<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Espace client — Inspire Pilates</title>
    <style>
      :root {
        --cream: #f7f2ea;
        --offwhite: #fbf8f2;
        --sand: #ede3d3;
        --beige: #e3d6c2;
        --taupe: #b7a78f;
        --clay: #9c8368;
        --wood: #7a5c41;
        --umber: #5c4632;
        --ink: #2e2620;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--umber);
        font-family: "Jost", "Century Gothic", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 2rem;
        opacity: 0.9;
      }
      .code {
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--clay);
        margin: 0 0 1.25rem;
      }
      h1 {
        font-family: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: clamp(2.25rem, 6vw, 3.25rem);
        line-height: 1.1;
        margin: 0 0 1.25rem;
        color: var(--umber);
      }
      h1 em { font-style: italic; color: var(--wood); }
      p {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(46, 38, 32, 0.72);
        margin: 0 auto 2.25rem;
        max-width: 26rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.95rem 2.25rem;
        border-radius: 999px;
        background: var(--umber);
        color: var(--cream);
        text-decoration: none;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: background-color 0.4s ease;
      }
      .btn:hover { background: var(--wood); }
      .footer {
        margin-top: 3rem;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--taupe);
      }
      .divider {
        width: 40px;
        height: 1px;
        background: var(--taupe);
        opacity: 0.5;
        margin: 0 auto 2rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/images/icon.svg" alt="Inspire Pilates" />
      <p class="code">Espace client · Erreur 404</p>
      <h1>Votre espace <em>arrive bientôt</em></h1>
      <div class="divider"></div>
      <p>
        L'espace client Inspire Pilates (réservations, crédits, historique)
        est en cours de préparation. Il sera disponible très prochainement.
        En attendant, retrouvez toutes les informations sur notre site.
      </p>
      <a class="btn" href="https://www.inspirepilates.fr">Retour au site</a>
      <p class="footer">Inspire Pilates · Vertou</p>
    </main>
  </body>
</html>
